version: 2

# Tier 3: a human decides when keanu ships. Dependabot batches minor/patch bumps
# into one Monday-morning PR that waits for review — nothing here auto-merges.

updates:
  # keanu is uv-managed: pyproject.toml + uv.lock, since commit 3e471d0 "move to uv".
  # This is the only ecosystem declared here. The pre-uv Pipfile/Pipfile.lock and the
  # Dockerfile that installed from them were deleted — see issues #9 and #10.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
