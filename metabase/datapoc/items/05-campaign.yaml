      native:
        query: "SELECT \n    c.status, COUNT(*)\nFROM consent c\nJOIN (\n    SELECT\
          \ contact_id, MAX(created_at) latest FROM consent WHERE {{campaign_id}}\
          \ AND {{consent_date}} GROUP BY contact_id\n) l ON l.contact_id=c.contact_id\
          \ AND l.latest=c.created_at\nJOIN contact ON contact.id=c.contact_id\nLEFT\
          \ JOIN source ON source.id=c.source_id\nWHERE {{lang}} AND {{country}} AND\
