collection_id: 101
collection_position: null
database_id: 9
dataset_query:
  database: 9
  native:
    query: "SELECT \n    c.status, COUNT(*)\nFROM consent c\nJOIN (\n    SELECT contact_id,\
      \ MAX(created_at) latest FROM consent WHERE {{campaign_id}} AND {{consent_date}}\
      \ GROUP BY contact_id\n) l ON l.contact_id=c.contact_id AND l.latest=c.created_at\n\
      JOIN contact ON contact.id=c.contact_id\nLEFT JOIN source ON source.id=c.source_id\n\
      WHERE {{lang}} AND {{country}} AND {{consent_medium}}\nGROUP BY status\n"
    template-tags:
      campaign_id:
        dimension:
        - field-id
        - 7134
        display-name: Campaign id
        id: 62d6ffae-1ee6-2b15-7252-fd639a7d6317
        name: campaign_id
        required: true
        type: dimension
        widget-type: id
      consent_date:
        dimension:
        - field-id
        - 7136
        display-name: Consent date
        id: 29f27702-28ac-1c8d-3d1d-002d7c34ae29
        name: consent_date
        type: dimension
        widget-type: date/all-options
      consent_medium:
        dimension:
        - field-id
        - 6610
        display-name: Medium
        id: b8820690-3f18-b2a2-5b59-722a69ca9aa5
        name: consent_medium
        type: dimension
        widget-type: category
      country:
        dimension:
        - field-id
        - 6509
        display-name: Country
        id: 92ab47b8-7ae2-b52c-5d13-91130d30b353
        name: country
        type: dimension
        widget-type: location/country
      lang:
        dimension:
        - field-id
        - 6504
        display-name: Language
        id: 5c1f89cf-49fc-3482-39d6-ca468bb0d837
        name: lang
        type: dimension
        widget-type: category
  type: native
