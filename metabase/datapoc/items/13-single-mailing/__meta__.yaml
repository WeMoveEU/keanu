        \    JOIN source s ON s.id = broadcast_link.source_id\n    JOIN consent ON\
        \ consent.source_id=s.id\n    WHERE {{broadcast_id}}\n    GROUP BY contact_id\n\
        ) l ON l.contact_id=c.contact_id AND l.latest=c.created_at\nGROUP BY status\n"
