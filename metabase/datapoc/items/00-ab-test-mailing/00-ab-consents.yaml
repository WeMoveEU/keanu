collection_id: 102
collection_position: null
database_id: 9
dataset_query:
  database: 9
  native:
    query: "SELECT \n    SUBSTR(l.name, 1, 6) AS version, c.status AS consent_status,\
      \ COUNT(*) AS `count`\nFROM consent c\nJOIN (\n    SELECT \n        broadcast.name,\
      \ contact_id, MAX(created_at) latest \n    FROM broadcast\n    JOIN broadcast_link\
      \ link ON link.broadcast_id=broadcast.id\n    JOIN source s ON s.id = link.source_id\n\
      \    JOIN consent ON consent.source_id=s.id\n    WHERE {{broadcast_test_id}}\n\
      \    GROUP BY broadcast.id, contact_id\n) l ON l.contact_id=c.contact_id AND\
      \ l.latest=c.created_at\nGROUP BY version, consent_status\n"
    template-tags:
      broadcast_test_id:
        dimension:
        - field-id
        - 6643
        display-name: Broadcast test id
        id: 533c2fdc-6e2e-174a-e25c-e8e6ac205aeb
        name: broadcast_test_id
        required: true
        type: dimension
        widget-type: id
  type: native
