collection_id: 106
collection_position: null
database_id: 9
dataset_query:
  database: 9
  native:
    query: |-
      SELECT DATE_FORMAT(c.created_at, '%Y-%m') AS cancel_month, COUNT(*)
      FROM segment s
      JOIN consent c ON c.status = 'cancelled'
      LEFT JOIN contact_segment cs ON cs.segment_id = s.id AND c.contact_id = cs.contact_id AND ABS(TIMESTAMPDIFF(MINUTE, c.created_at, cs.left_at)) <= 60
      WHERE s.name='Member' AND cs.id IS NULL
      GROUP BY cancel_month
  type: native
description: null
display: line
id: 522
model: card
name: Count of cancelled consents without a member leave, over time
query_type: native
visualization_settings:
  graph.dimensions:
  - cancel_month
  graph.metrics:
  - COUNT(*)
  graph.x_axis.title_text: Cancel month
  series_settings:
    COUNT(*):
      line.interpolate: step-after
      line.marker_enabled: false
      title: Count
