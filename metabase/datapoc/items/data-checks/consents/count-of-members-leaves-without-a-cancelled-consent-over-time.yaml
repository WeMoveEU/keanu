collection_id: 106
collection_position: null
database_id: 9
dataset_query:
  database: 9
  native:
    query: |2-

      SELECT DATE_FORMAT(cs.left_at, '%Y-%m') AS leave_month, COUNT(*)
      FROM segment s
      JOIN contact_segment cs ON cs.segment_id = s.id AND cs.left_at IS NOT NULL
      LEFT JOIN consent c ON c.contact_id = cs.contact_id AND ABS(TIMESTAMPDIFF(MINUTE, c.created_at, cs.left_at)) <= 60 AND c.status = 'cancelled'
      WHERE s.name='Member' AND c.id IS NULL
      GROUP BY leave_month
  type: native
description: By month
display: line
id: 516
model: card
name: Count of members leaves without a cancelled consent over time
query_type: native
visualization_settings:
  graph.dimensions:
  - leave_month
  graph.metrics:
  - COUNT(*)
  graph.x_axis.title_text: Leave month
  series_settings:
    COUNT(*):
      line.interpolate: step-after
      line.marker_enabled: false
      title: Count
